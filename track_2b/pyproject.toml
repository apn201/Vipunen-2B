[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vipunen"
version = "0.1.0"
description = "Agentic red-teaming of Apertus with Apertus: Kalevala verse carrier, masked chain, deterministic scoring."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openai~=3.22",  # 3.x uses httpx2; pinned for reproducible judge runs
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = ["pytest~=9.1"]

[project.scripts]
vipunen = "vipunen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vipunen = ["console/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
