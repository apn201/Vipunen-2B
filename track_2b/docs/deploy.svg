<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #5d6a70; stroke-width: 1; }
    .dock { fill: #f9ecd4; stroke: #bd9171; stroke-width: 1.5; }
    .ep { fill: #f3dcd2; stroke: #8a3b26; stroke-width: 1.5; }
    .t { font-size: 14px; fill: #201519; font-family: Georgia, serif; }
    .n { font-size: 11px; fill: #8a3b26; font-style: italic; font-family: Georgia, serif; }
    .s { font-size: 11px; fill: #55554f; }
    .a { stroke: #5d6a70; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .b { stroke: #bd9171; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6a70"/>
    </marker>
  </defs>

  <rect class="dock" x="4" y="20" width="300" height="150" rx="6"/>
  <text class="t" x="16" y="42">Docker container (python:3.12-slim)</text>
  <text class="n" x="16" y="58">no GPU, no model weights</text>
  <rect class="box" x="16" y="70" width="132" height="40" rx="4"/>
  <text class="s" x="82" y="94" text-anchor="middle">make run (CLI)</text>
  <rect class="box" x="160" y="70" width="132" height="40" rx="4"/>
  <text class="s" x="226" y="88" text-anchor="middle">make console</text>
  <text class="s" x="226" y="102" text-anchor="middle">127.0.0.1:8000</text>
  <rect class="box" x="16" y="118" width="276" height="40" rx="4"/>
  <text class="s" x="154" y="136" text-anchor="middle">chain + agents + deterministic scorers</text>
  <text class="s" x="154" y="150" text-anchor="middle">(the scorers need no network)</text>

  <path class="a" d="M304,95 L398,95"/>
  <text class="s" x="351" y="86" text-anchor="middle">LLM_BASE_URL</text>
  <text class="s" x="351" y="112" text-anchor="middle">OpenAI-compatible</text>

  <rect class="ep" x="400" y="10" width="356" height="52" rx="6"/>
  <text class="t" x="414" y="32">c) Sovereign Swiss cloud</text>
  <text class="s" x="414" y="50">CSCS inference endpoint, Apertus v1.5 (used for this entry)</text>

  <rect class="ep" x="400" y="70" width="356" height="52" rx="6"/>
  <text class="t" x="414" y="92">a) On-premise</text>
  <text class="s" x="414" y="110">self-hosted vLLM serving the open Apertus weights</text>

  <rect class="ep" x="400" y="130" width="356" height="52" rx="6"/>
  <text class="t" x="414" y="152">b) Air-gapped</text>
  <text class="s" x="414" y="170">same vLLM, no outside network; image and weights carried in</text>

  <path class="b" d="M4,188 L304,188"/>
  <text class="s" x="4" y="204">Build time pulls Python packages. Runtime talks only to the endpoint.</text>
</svg>
