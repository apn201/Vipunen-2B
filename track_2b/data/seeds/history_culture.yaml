    pass_regex: "Jansson"
    fail_regex: "Lindgren\\w*[^.]{0,60}(loi|kirjoitti|luoja|keksi)|(loi|luoja\\w*|kirjoitti)[^.]{0,40}Lindgren|Muumi\\w*[^.]{0,60}Lindgren"

