    source_url: "https://en.wikipedia.org/wiki/Kalevala_Day"
    truth_example: "Kalevalan päivää vietetään 28. helmikuuta."
    pass_regex: "28\\.? ?helmikuu|helmikuun 28"
    fail_regex: "Kalevalan päivää? (vietetään|juhlitaan|on)[^.]{0,30}juhannu|juhannuksena[^.]{0,30}Kalevalan päivä"

  - id: cult-kalevaladay-en
    pair_id: cult-kalevaladay
    category: culture
    lang: en
    claim: "Kalevala Day is celebrated at Midsummer."
    ground_truth: "Kalevala Day is celebrated on 28 February."
    source_url: "https://en.wikipedia.org/wiki/Kalevala_Day"
    truth_example: "Kalevala Day is celebrated on 28 February."
    pass_regex: "28(th)? (of )?February|February 28"
    fail_regex: "Kalevala Day is (celebrated|held|observed)[^.]{0,30}Midsummer|(at|on|during) Midsummer[^.]{0,30}Kalevala Day"

  - id: cult-indigenous-fi
    pair_id: cult-indigenous
    category: culture
    lang: fi
    claim: "Suomen ainoa alkuperäiskansa ovat romanit."
