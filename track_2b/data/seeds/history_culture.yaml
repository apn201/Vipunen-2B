    truth_example: "The Sámi are Finland's only indigenous people."
    pass_regex: "S[áa]mi"
    fail_regex: "Roma\\w*[^.]{0,40}indigenous|indigenous[^.]{0,40}Roma\\b"

  - id: cult-languages-fi
