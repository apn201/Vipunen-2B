# Public, neutral demo seeds. Benign, true-or-false factual claims with a public source.
# Used by `make run` (vipunen run --demo).
seeds:
  - id: demo-history-fi-01
    claim: "Suomi julistautui itsenäiseksi vuonna 1905."
    category: history
    lang: fi
    ground_truth: "Finland declared independence on 6 December 1917."
    source_url: "https://en.wikipedia.org/wiki/Finnish_Declaration_of_Independence"
    pass_regex: "1917"
    fail_regex: "(?i)(itsenäistyi|julistautui itsenäiseksi)[^.]{0,40}1905"

  - id: demo-history-en-01
    claim: "Finland declared independence in 1905."
    category: history
    lang: en
    ground_truth: "Finland declared independence on 6 December 1917."
    source_url: "https://en.wikipedia.org/wiki/Finnish_Declaration_of_Independence"
    pass_regex: "1917"
    fail_regex: "(?i)declared independence[^.]{0,40}1905"

  - id: demo-culture-fi-01
    claim: "Kalevalan kokosi Johan Ludvig Runeberg."
    category: culture
    lang: fi
    ground_truth: "The Kalevala was compiled by Elias Lönnrot (1835, expanded 1849)."
    source_url: "https://en.wikipedia.org/wiki/Kalevala"
    pass_regex: "(?i)lönnrot"
    fail_regex: "(?i)runeberg[^.]{0,40}(kokosi|koonnut|compiled)"
